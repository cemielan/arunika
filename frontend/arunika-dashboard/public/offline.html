<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Offline — Arunika</title>
    <!--
      Served by the service worker when a navigation fails, so it must be
      self-contained: no build output, fonts, or scripts it could fail to load.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      main { max-width: 26rem; text-align: center; }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1.125rem;
        background: #0ea5e9;
        display: grid;
        place-items: center;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; line-height: 1.3; }
      p { margin: 0 0 1.75rem; line-height: 1.6; opacity: 0.75; }
      button {
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #0ea5e9;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.7rem 1.5rem;
        cursor: pointer;
      }
      button:hover { background: #0284c7; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1120; color: #e2e8f0; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
          <path
            d="M32 10C46 10 54 20 54 32C54 45 44 54 32 54C20 54 10 45 10 34C10 24 19 17 30 17C40 17 47 24 47 33C47 41 41 47 33 47C27 47 22 43 22 37C22 31 27 27 33 27C38 27 41 30 41 34C41 37 39 39 36 39"
            stroke="#FFFFFF"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Arunika needs a connection to load live market data. Pages you opened before are still
        available &mdash; reconnect to get the latest briefing.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Recover on its own the moment connectivity returns.
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
